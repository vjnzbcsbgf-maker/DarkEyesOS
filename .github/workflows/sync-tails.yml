name: Sync Tails baseline

# Fetches a Tails release, verifies its signature, and extracts its functional
# config into config/tails-base/<version>/, then opens a Pull Request. This is
# how DarkEyesOS tracks Tails 7.12 and every future edition — bump the version
# (or let the monthly schedule catch new releases) and review the diff.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tails version to sync (e.g. 7.12)'
        default: '7.12'
      baseurl:
        description: 'Override download base URL (optional)'
        default: ''
  schedule:
    # Monthly nudge to check for a newer Tails baseline (Tails releases ~monthly).
    - cron: '0 6 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools gpgv gnupg curl

      - name: Fetch + verify + extract Tails config
        env:
          TAILS_VERSION: ${{ github.event.inputs.version || '7.12' }}
          TAILS_BASEURL: ${{ github.event.inputs.baseurl }}
        run: |
          set -eux
          sudo -E ./scripts/sync-tails.sh "${TAILS_VERSION}"
          sudo chown -R "$(id -u):$(id -g)" config/tails-base

      - name: Push the baseline to a branch (no PR permission needed)
        env:
          VERSION: ${{ github.event.inputs.version || '7.12' }}
        run: |
          set -eux
          if git diff --quiet -- config/tails-base && git ls-files --error-unmatch config/tails-base/"$VERSION" >/dev/null 2>&1; then
            echo "No changes in the Tails baseline; nothing to push."
            exit 0
          fi
          git config user.name  "DarkEyesOS Tails Sync"
          git config user.email "noreply@darkeyesos.invalid"
          BR="tails-sync/${VERSION}"
          git checkout -B "$BR"
          git add config/tails-base
          git commit -m "Sync Tails ${VERSION} functional config baseline (signature-verified)" || {
            echo "Nothing to commit."; exit 0; }
          git push -f origin "$BR"
          echo "Baseline pushed to branch: $BR"
          echo "Open a PR to review/merge: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BR}?expand=1"
