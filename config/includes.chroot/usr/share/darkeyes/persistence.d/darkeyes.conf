# DarkEyesOS persistence feature map (live-boot custom persistence.conf format).
# Each line = a path that CAN be persisted, and how. Nothing here is active until
# the user creates the LUKS volume (label DarkEyes-Persistence) and enables the
# feature in the Control Center, which writes the chosen subset to the volume's
# own persistence.conf. This file is the catalog of what's offered.
#
# Syntax: <path>  <options>
#   source=<dir>   store this path under <dir> on the persistent volume
#   link           bind-mount (default), so live path shows the persisted data

# --- Personal data ---
/home/amnesia/Persistent            source=Persistent,link
/home/amnesia/.gnupg                source=gnupg,link
/home/amnesia/.ssh                  source=ssh,link

# --- Application data the user commonly wants to keep ---
/home/amnesia/.local/share/torbrowser   source=torbrowser,link
/home/amnesia/.config/keepassxc         source=keepassxc,link

# --- Optional: extra software installed into persistence ---
# When enabled, packages installed at runtime persist here and are re-applied at
# boot by darkeyes-persistence (APT dpkg selections).
/var/cache/apt/archives             source=apt-archives,link
/etc/darkeyes/additional-packages   source=additional-packages,link

# --- Dotfiles (advanced; off by default) ---
# /home/amnesia/dotfiles            source=dotfiles,link
