<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#10141d"/>
      <stop offset="60%" stop-color="#080b11"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa0ff"/>
      <stop offset="100%" stop-color="#1257d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3aa0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3aa0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>
  <circle cx="1920" cy="880" r="620" fill="url(#glow)"/>

  <!-- Eye -->
  <g transform="translate(1920,880)">
    <path d="M-360 0 C -190 -230, 190 -230, 360 0 C 190 230, -190 230, -360 0 Z"
          fill="#0b0e14" stroke="#7fb4ff" stroke-width="9"/>
    <circle r="150" fill="url(#iris)"/>
    <circle r="68" fill="#04060a"/>
    <circle cx="-46" cy="-42" r="28" fill="#eaf3ff" opacity="0.9"/>
    <!-- padlock -->
    <path d="M-46 -30 v-30 a46 46 0 0 1 92 0 v30"
          fill="none" stroke="#eaf3ff" stroke-width="15" stroke-linecap="round"/>
    <rect x="-42" y="-30" width="84" height="66" rx="13" fill="#eaf3ff"/>
    <rect x="-8" y="-6" width="16" height="24" rx="8" fill="#1257d6"/>
  </g>

  <text x="1920" y="1560" text-anchor="middle"
        font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="700"
        font-size="150" fill="#eaf3ff" letter-spacing="4">DarkEyesOS</text>
  <text x="1920" y="1680" text-anchor="middle"
        font-family="Cantarell, 'DejaVu Sans', sans-serif" font-weight="500"
        font-size="66" fill="#7fb4ff" letter-spacing="14">YOUR DATA IS YOURS</text>
</svg>
