#!/usr/sbin/nft -f
# DarkEyesOS fail-closed Tor firewall.
# Everything is redirected through Tor's TransPort/DNSPort. Anything that cannot
# be transparently proxied (clearnet, IPv6, non-Tor UDP) is DROPPED. If tor is
# down you get NO network — never a clearnet leak.
#
# Tor runs as user "debian-tor"; that uid is the only one allowed to talk to the
# real internet (so Tor itself can reach guards/bridges).

flush ruleset

define tor_uid = 0        # replaced at boot by darkeyes-firewall.service with the
                          # real debian-tor uid via `id -u debian-tor`.
define trans_port = 9040
define dns_port   = 5353
define virt_net   = 10.192.0.0/10   # Tor's virtual address range (AutomapHosts)

table inet darkeyes {

    # ---- Redirect clearnet DNS + TCP into Tor (NAT/output) ----
    chain output_nat {
        type nat hook output priority -100; policy accept;

        # Tor's own traffic and loopback pass untouched.
        meta skuid $tor_uid return
        oif "lo" return

        # DNS -> Tor DNSPort
        meta l4proto udp udp dport 53 redirect to :$dns_port
        meta l4proto tcp tcp dport 53 redirect to :$dns_port

        # Tor virtual addresses + all other TCP -> Tor TransPort
        ip daddr $virt_net meta l4proto tcp redirect to :$trans_port
        meta l4proto tcp redirect to :$trans_port
    }

    # ---- Filter: fail-closed egress ----
    chain output_filter {
        type filter hook output priority 0; policy drop;

        # Loopback: allow (this is where Tor's ports live).
        oif "lo" accept
        ct state established,related accept

        # Tor daemon may reach the internet to build circuits.
        meta skuid $tor_uid accept

        # Allow already-redirected DNS/TransPort dports on loopback (handled above).
        ip daddr 127.0.0.0/8 accept

        # Everything else (clearnet, IPv6, stray UDP) is DROPPED by policy.
        # IPv6 is disabled at the sysctl level too.
        log prefix "darkeyes-drop-out " limit rate 3/minute
    }

    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state established,related accept
        # No inbound services on an amnesic client.
        log prefix "darkeyes-drop-in " limit rate 3/minute
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
