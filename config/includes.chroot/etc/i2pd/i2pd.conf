# DarkEyesOS i2pd configuration — lean, amnesic-friendly I2P daemon.
# Runs alongside Tor. .i2p eepsites go through the HTTP proxy below; the
# fail-closed firewall lets ONLY the i2pd and tor users reach the network.

# Keep state small; the live system is in RAM.
log = stdout
loglevel = warn

# Don't advertise as a floodfill/relay by default (client posture).
floodfill = false
notransit = true

ipv6 = false
ipv4 = true

[ntcp2]
enabled = true

[ssu2]
enabled = true

# --- HTTP proxy for the I2P Browser (.i2p eepsites) ---
[httpproxy]
enabled = true
address = 127.0.0.1
port = 4444

# --- SOCKS proxy for I2P-aware apps ---
[socksproxy]
enabled = true
address = 127.0.0.1
port = 4447

# --- Local web console (status) ---
[http]
enabled = true
address = 127.0.0.1
port = 7070

# --- SAM bridge off by default (reduce surface) ---
[sam]
enabled = false
