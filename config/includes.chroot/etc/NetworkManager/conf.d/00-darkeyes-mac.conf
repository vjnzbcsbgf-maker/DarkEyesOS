# DarkEyesOS — randomize MAC addresses to resist link-layer tracking.
[device-mac-randomization]
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
# Use a different random MAC for every connection (both Wi-Fi and Ethernet).
ethernet.cloned-mac-address=random
wifi.cloned-mac-address=random

[main]
# Do not touch /etc/resolv.conf; DNS is handled by Tor's DNSPort + firewall.
dns=none
# No connectivity check phoning home to a clearnet server.
[connectivity]
enabled=false
